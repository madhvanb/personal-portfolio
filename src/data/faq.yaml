- id: patent
  question: Wait, you have a patent for an espresso brewer?
  answer: |-
    A patent application, yes: a manual espresso brewer I designed during my B.Tech. It was published as Indian Patent Application No. 202311004209 A in January 2023.

    It came out of research where I measured coffee extractions and modelled the data. More on the coffee page.
  home: true
